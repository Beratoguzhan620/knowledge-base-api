# Runs without downloading models: the built-in embeddings and extractive answers instead of Ollama.
# Search still works by shared words and word stems, and answers quote the documents; CI uses this to stay fast.
#   docker compose -f docker-compose.yml -f docker-compose.light.yml up --build
services:
  ollama:
    profiles: [ollama]
  models:
    profiles: [ollama]
  api:
    environment:
      Embeddings__Provider: Local
      Chat__Provider: Local
      Answers__MinSimilarity: "0.25"
