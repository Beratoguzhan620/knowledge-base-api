name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KnowledgeBase.slnx

      - name: Build
        run: dotnet build KnowledgeBase.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/KnowledgeBase.UnitTests/KnowledgeBase.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests (PostgreSQL with pgvector in Testcontainers)
        run: dotnet test tests/KnowledgeBase.IntegrationTests/KnowledgeBase.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations has-pending-model-changes --project src/KnowledgeBase.Infrastructure --startup-project src/KnowledgeBase.Api --no-build --configuration Release

  web:
    name: Web app
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: An owner and a reader in browsers
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start the stack (built-in models)
        env:
          AUTH_ATTEMPTS_PER_MINUTE: '1000'
        run: docker compose -f docker-compose.yml -f docker-compose.light.yml up --build --detach --wait --wait-timeout 300

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the walkthrough
        working-directory: tests/e2e
        run: node kb.mjs

      - name: Show logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.light.yml logs --no-color api web

      - name: Keep the last screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/output/

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.light.yml down --volumes

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (built-in embeddings, no model download)
        run: docker compose -f docker-compose.yml -f docker-compose.light.yml up --build --detach --wait --wait-timeout 300

      - name: Register, upload, wait for indexing, search and ask
        run: bash tests/smoke/ask.sh

      - name: Show logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.light.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.light.yml down --volumes

  models:
    name: With real models (Ollama)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack and download the models
        run: docker compose up --build --detach --wait --wait-timeout 900

      - name: Register, upload, wait for indexing, search and ask
        run: bash tests/smoke/ask.sh

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color api models

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
