name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KnowledgeBase.slnx

      - name: Build
        run: dotnet build KnowledgeBase.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/KnowledgeBase.UnitTests/KnowledgeBase.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests (PostgreSQL with pgvector in Testcontainers)
        run: dotnet test tests/KnowledgeBase.IntegrationTests/KnowledgeBase.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations has-pending-model-changes --project src/KnowledgeBase.Infrastructure --startup-project src/KnowledgeBase.Api --no-build --configuration Release

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Register, upload a document and read its passages back
        run: |
          api=http://localhost:8080
          session=$(curl -sf $api/api/auth/register -H 'Content-Type: application/json' -d '{"email":"ayse@example.com","displayName":"Ayşe","password":"smoke-test-password"}')
          token=$(echo "$session" | jq -r .accessToken)
          workspace=$(curl -sf $api/api/me -H "Authorization: Bearer $token" | jq -r '.workspaces[0].id')
          printf '# Returns\n\nItems can be sent back within 14 days.\n\n## Refunds\n\nRefunds take 3 working days.\n' > returns.md
          document=$(curl -sf $api/api/workspaces/$workspace/documents -H "Authorization: Bearer $token" -F file=@returns.md | jq -r .id)
          curl -sf "$api/api/workspaces/$workspace/documents/$document/chunks" -H "Authorization: Bearer $token" | jq -e '.total == 2 and .items[1].heading == "Refunds"' > /dev/null
          docker compose exec -T db psql -U knowledge_base -d knowledge_base -tAc "SELECT extversion FROM pg_extension WHERE extname = 'vector'" | grep -q '[0-9]'
          echo "A document was uploaded, split by heading and stored next to pgvector through the Compose stack."

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
