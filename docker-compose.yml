# One command: docker compose up --build
# The first start downloads two small models (about 1.3 GB) into a volume; later starts reuse them.
# Without downloads: docker compose -f docker-compose.yml -f docker-compose.light.yml up --build
# The app: http://localhost:8080 · API reference: http://localhost:8080/scalar
name: knowledge-base

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: knowledge_base
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge-base-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_base -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.10
    environment:
      # Room for the instructions, six passages and a few earlier turns.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: 1h
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Downloads the models once, then exits.
  models:
    image: ollama/ollama:0.40.10
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${EMBEDDING_MODEL:-nomic-embed-text} ${CHAT_MODEL:-qwen2.5:1.5b}
    entrypoint: ["sh", "-c", "for model in $$MODELS; do ollama pull $$model || exit 1; done"]

  api:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      models:
        condition: service_completed_successfully
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__KnowledgeBase: "Host=db;Database=knowledge_base;Username=knowledge_base;Password=${POSTGRES_PASSWORD:-knowledge-base-local}"
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-signing-key-change-me-in-the-env-file-0123456789}
      Auth__AttemptsPerMinute: ${AUTH_ATTEMPTS_PER_MINUTE:-10}
      # nginx is in front: per-address limits must see the browser's address, not nginx's.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Embeddings__Provider: OpenAI
      Embeddings__BaseUrl: http://ollama:11434/v1/
      Embeddings__Model: ${EMBEDDING_MODEL:-nomic-embed-text}
      Embeddings__DocumentPrefix: "search_document: "
      Embeddings__QueryPrefix: "search_query: "
      Chat__Provider: OpenAI
      Chat__BaseUrl: http://ollama:11434/v1/
      Chat__Model: ${CHAT_MODEL:-qwen2.5:1.5b}
      # nomic-embed-text scores unrelated passages around 0.4 and related ones above 0.5.
      Answers__MinSimilarity: "0.5"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  ollama-models:
